proxy-groups:
- name: 🚀 Proxy
  type: select
  proxies:
  - ♻️ Auto
  - 其他
  - '[289.1ms +/-2ms] US'
  - '[530.9ms +/-10ms] RU'
- name: ♻️ Auto
  type: url-test
  proxies:
  - '[289.1ms +/-2ms] US'
  - '[530.9ms +/-10ms] RU'
  url: https://www.gstatic.com/generate_204
  interval: 600
- name: 其他
  type: url-test
  proxies:
  - '[289.1ms +/-2ms] US'
  - '[530.9ms +/-10ms] RU'
  url: https://www.gstatic.com/generate_204
  interval: 600
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
  - https://223.5.5.5/dns-query
  - https://114.114.114.114/dns-query
